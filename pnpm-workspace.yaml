packages:
    - 'libs/*'
    - 'consumers/*'

verifyDepsBeforeRun: error
autoInstallPeers: false

allowBuilds:
    '@confluentinc/kafka-javascript': true
    '@parcel/watcher': false
    esbuild: true
    msgpackr-extract: true
    unrs-resolver: true

overrides:
    equipped: 5.3.7
    valleyed: 4.5.25

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - equipped
    - valleyed
    - xi-configs
