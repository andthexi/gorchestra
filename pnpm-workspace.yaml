packages:
    - 'libs/*'
    - 'consumers/*'

allowBuilds:
    '@confluentinc/kafka-javascript': true
    '@parcel/watcher': false
    esbuild: true
    msgpackr-extract: true
    protobufjs: true
    unrs-resolver: true

overrides:
    equipped: 5.3.4
    valleyed: 4.5.24

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - equipped
    - valleyed
