name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    checks:
        name: Monorepo checks
        if: ${{ !github.event.pull_request.draft }}
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            DO_NOT_TRACK: '1'
            FALLOW_TELEMETRY_DISABLED: '1'
            FALLOW_UPDATE_CHECK: '0'
            VITEST_MAX_WORKERS: '2'
        defaults:
            run:
                shell: bash
        steps:
            - name: Check out the pull request
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24.22.3'
                  package-manager-cache: false
            - name: Set up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
              with:
                  run_install: false
                  cache: false
            - name: Install dependencies
              id: install
              run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
            - name: Lint the monorepo
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm lint
            - name: Check monorepo formatting
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm format
            - name: Typecheck workspace projects
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm typecheck
            - name: Test workspace packages
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm test
            - name: Check monorepo Fallow findings
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: pnpm fallow:check
            - name: Audit changes against the PR target
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              env:
                  FALLOW_AUDIT_BASE: ${{ github.event.pull_request.base.sha }}
              run: pnpm fallow:audit --base "$FALLOW_AUDIT_BASE"
